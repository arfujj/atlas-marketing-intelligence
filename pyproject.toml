[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS — Marketing Intelligence & Decision Engine"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Core = what the API needs to serve. Fitting and the warehouse build are extras, so the
# deployed API image stays small (`make setup` installs everything).
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
warehouse = ["dbt-duckdb>=1.8"]
models = [
    "arviz>=0.19",
    "nutpie>=0.13",
    "pymc>=5.16",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
