name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
      - run: make setup
      - run: make lint
      - run: make test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup && make build
      - working-directory: web
        run: npm ci && npm run typecheck && npx eslint src && npm test
      - working-directory: web
        run: npx playwright install --with-deps chromium && npx next build
      - name: End-to-end (API + production web build)
        run: |
          uv run uvicorn atlas.api.app:app --port 8000 &
          (cd web && ATLAS_API_URL=http://127.0.0.1:8000 npx next start -p 3210) &
          npx wait-on -t 120000 http://127.0.0.1:8000/health http://127.0.0.1:3210/halden
          cd web && npm run e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
